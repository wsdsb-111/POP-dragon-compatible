l_english:
 trait_mm_asc_usurper_blood:0 "Blood of the Throne Usurper"
 trait_mm_asc_usurper_blood_desc:0 "Unfused royal blood grants modest strength while distorting the body and carrying whispers of the throne. Erosion advances annually. One paid fusion ritual is allowed per calendar year. The first track to reach its limit decides the outcome; an unfinished usurper cannot transform."
 mm_asc_usurper_source_desc:0 "$trait_mm_asc_usurper_blood_desc$\n\nActual blood source: [ROOT.Char.MakeScope.Var('mm_asc_blood_source').Char.GetName]."
 trait_mm_asc_master_blood:0 "Blood of the Throne Master"
 mm_asc_master_source_desc:0 "The blood is fully fused, restoring every original bathing-in-dragon-blood bonus and ending this system's erosion and whispers. The bearer's identity and name remain intact. The original human appearance and the actual source dragon's form are both available.\n\nActual blood source: [ROOT.Char.MakeScope.Var('mm_asc_blood_source').Char.GetName]."
 mm_asc_master_unknown_desc:0 "Every original bathing-in-dragon-blood bonus is preserved as a completed legacy state. No erosion or ritual costs are added. The old save did not record a reliable blood source, so neither a royal origin nor a dragon form is invented."
 trait_mm_asc_dragon_body:0 "Twofold Dragonblood Body"
 trait_mm_asc_dragon_body_desc:0 "A completed blood trial permits this same character to alternate between the original human appearance and the actual blood source's dragon form, preserving identity, parents, house, ancestry, and titles."
 mm_asc_body_source_desc:0 "$trait_mm_asc_dragon_body_desc$\n\nActual blood source: [ROOT.Char.MakeScope.Var('mm_asc_blood_source').Char.GetName]. Dragon size and scale colour were recorded from this source."
 trait_track_mm_asc_erosion:0 "Dragonblood Erosion"
 trait_track_mm_asc_erosion_desc:0 "Advances by 10 each year. Reaching 100 first succeeds the actual source's name and royal rank on the same character, initially in dragon form. Human form remains available. In the Black Blood trial, erosion reaching 100 first turns you into a Death Servant."
 trait_track_mm_asc_fusion:0 "Dragonblood Fusion Rituals"
 trait_track_mm_asc_fusion_desc:0 "Each paid ritual adds 20, once per calendar year. Reaching 100 first preserves the bearer's own name and identity, restores the old blood bonuses, and unlocks reversible dragon form, initially human. In the Black Blood trial, fusion reaching 100 first grants first-generation blood sourced to the Black Emperor, without a throne or dragon body."
 mm_asc_erosion_0:0 "Early Dragonblood Erosion"
 mm_asc_erosion_25:0 "Deepening Dragonblood Erosion"
 mm_asc_erosion_50:0 "Severe Dragonblood Erosion"
 mm_asc_erosion_75:0 "Uncontrolled Dragonblood Erosion"
 mm_asc_whispers:0 "Whispers of the Throne"
 mm_asc_whisper_paranoia:0 "Echo-induced Paranoia"
 mm_asc_whisper_madness:0 "Echo-induced Madness"
 nick_mm_asc_successor:0 "the Returned Dragon King"
 mm_asc_fusion_ritual_decision:0 "Perform a Dragonblood Fusion Ritual"
 mm_asc_fusion_ritual_decision_desc:0 "Spend 250 gold, 250 piety, and 100 prestige to advance fusion by 20. This is possible once per calendar year, with payment revalidated at execution. Finishing fusion first preserves your identity and name, restores all former blood bonuses, unlocks the source dragon's form, and ends this system's erosion and whispers."
 mm_asc_fusion_ritual_decision_tooltip:0 "Pay 250 gold, 250 piety, and 100 prestige for 20 fusion. Unavailable after this year's ritual, full erosion, incapacity, or a source conflict."
 mm_asc_change_form_decision:0 "Change Dragonblood Form"
 mm_asc_change_form_decision_desc:0 "Alternate between your original human appearance and your actual blood source's dragon form. Both completed outcomes retain this ability. Changing form never changes character ID, name, the outcome, parents, house, ancestry, or attributes. Unfinished usurpers and legacy characters without a reliable source cannot use it."
 mm_asc_change_form_decision_tooltip:0 "Change human/dragon appearance on the same character without replaying the trial."
 mm_asc_devour_own_twin_interaction:0 "Devour My Twin"
 mm_asc_devour_own_twin_interaction_desc:0 "Permanently devour the present twin of my throne, retaining this same character as the complete sovereign. Both must be current, awakened, reciprocal holders. Each throne can unite only once; the dead twin cannot be awakened again."
 mm_asc.0001.t:0 "Whispers Behind the Throne"
 mm_asc.0001.desc:0 "The echo within my blood claws at my thoughts again. It demands that I surrender my judgement, body, and will to an ancient throne. Holding on to myself has a price."
 mm_asc.0001.a:0 "My will remains my own."
 mm_asc.0001.b:0 "I must hear what it wants..."
 mm_asc.0002.t:0 "Master of My Own Throne"
 mm_asc.0002.desc:0 "The blood finally yields to my will. My own name and identity remain intact. Erosion and whispers cease; every old blood bonus is restored, and this same body may take my original human appearance or the actual source dragon's shape."
 mm_asc.0002.a:0 "The throne answers to me."
 mm_asc.0003.t:0 "An Old Name, a New Sovereign"
 mm_asc.0003.desc:0 "Erosion reached its limit before fusion. The echo takes command: I inherit the actual source's name and royal standing on this same character. The source dragon's form is now my default, though my original human appearance remains available. My parents, house, and other ancestry have not been erased."
 mm_asc.0003.a:0 "The dragon's name is spoken again."
 mm_asc.0004.t:0 "The Royal Source Cannot Be Confirmed"
 mm_asc.0004.desc:0 "The trial reached its limit, but the actual source, recorded form, or present holder of the royal seat conflicts. No final outcome is committed, no name is invented, and no rival's throne is taken. Further rituals will not charge resources until the source can be verified."
 mm_asc.0004.a:0 "Preserve the existing records."
