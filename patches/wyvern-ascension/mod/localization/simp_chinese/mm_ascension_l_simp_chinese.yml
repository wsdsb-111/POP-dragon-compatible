l_simp_chinese:
 trait_mm_asc_usurper_blood:0 "王座僭主之血"
 trait_mm_asc_usurper_blood_desc:0 "尚未融合的龙王之血带来微弱力量，也使肉身畸变、精神承受王座低语。龙血侵蚀每年推进；每个日历年最多举行一次付费融合仪式。先达到上限的一条轨道决定结局，僭主阶段不能化龙。"
 mm_asc_usurper_source_desc:0 "$trait_mm_asc_usurper_blood_desc$\n\n实际血源：[ROOT.Char.MakeScope.Var('mm_asc_blood_source').Char.GetName]。"
 trait_mm_asc_master_blood:0 "王座执掌之血"
 mm_asc_master_source_desc:0 "此人已彻底融合龙血，拥有旧沐浴龙血的全部力量，停止承受本系统的侵蚀与低语。本人身份与名字保持，可在原本人形和血源对应的龙形之间切换。\n\n实际血源：[ROOT.Char.MakeScope.Var('mm_asc_blood_source').Char.GetName]。"
 mm_asc_master_unknown_desc:0 "此人已拥有旧沐浴龙血的全部力量，按融合完成状态保留，不再追加侵蚀或仪式费用。旧档没有可靠记录血源，不能猜测其龙王来源，因此不会自动授予来源不明的龙形。"
 trait_mm_asc_dragon_body:0 "龙血双相之躯"
 trait_mm_asc_dragon_body_desc:0 "已完结龙血试炼的可逆身体；同一人物可在原本人形与真实血源的龙形间切换。化形不替换人物、父母、家族、祖源或领地。"
 mm_asc_body_source_desc:0 "$trait_mm_asc_dragon_body_desc$\n\n实际血源：[ROOT.Char.MakeScope.Var('mm_asc_blood_source').Char.GetName]；龙形身量与鳞色记录自该血源。"
 trait_track_mm_asc_erosion:0 "龙血侵蚀"
 trait_track_mm_asc_erosion_desc:0 "每年增加10点。侵蚀先到100时，残留王权取得主导：继承血源姓名与对应王权，同ID默认龙形，之后仍可化人。 黑血晋升考验中，侵蚀先达100则变为死侍。"
 trait_track_mm_asc_fusion:0 "龙血融合仪式"
 trait_track_mm_asc_fusion_desc:0 "每次付费仪式增加20点，每个日历年最多一次。先到100时，融合完成并保留本人名字与身份，获得王座执掌之血与可逆化龙，默认人形。 黑血晋升考验中，融合先达100则成为以黑皇为血脉始祖的初代种，不获得王座或龙身。"
 mm_asc_erosion_0:0 "初现的龙化侵蚀"
 mm_asc_erosion_25:0 "加深的龙化侵蚀"
 mm_asc_erosion_50:0 "严重的龙化侵蚀"
 mm_asc_erosion_75:0 "濒临失控的龙化侵蚀"
 mm_asc_whispers:0 "王座低语"
 mm_asc_whisper_paranoia:0 "残响诱发的偏执"
 mm_asc_whisper_madness:0 "残响诱发的狂乱"
 nick_mm_asc_successor:0 "复临的龙王"
 mm_asc_fusion_ritual_decision:0 "举行龙血融合仪式"
 mm_asc_fusion_ritual_decision_desc:0 "以250金币、250虔诚和100威望稳固自我，让龙血融合轨道推进20点。每个日历年只能举行一次；只有全部条件仍成立时才付款。若融合先达到100，将保留本人身份与名字，获得全部沐血能力及源龙形态，停止本系统侵蚀与低语。"
 mm_asc_fusion_ritual_decision_tooltip:0 "支付250金币、250虔诚、100威望，融合+20；当年已举行、侵蚀已满、失能或来源冲突时不能执行。"
 mm_asc_change_form_decision:0 "切换龙血形态"
 mm_asc_change_form_decision_desc:0 "在原本人形与实际血源的龙形之间切换。两种结局都保留这一能力，形态切换不改人物ID、名字、王权结果、父母、家族、祖源或属性。僭主阶段及缺少可靠血源的旧档角色不能使用。"
 mm_asc_change_form_decision_tooltip:0 "同一人物切换人形／龙形；不重新结算龙血试炼。"
 mm_asc_devour_own_twin_interaction:0 "吞噬我的双生子"
 mm_asc_devour_own_twin_interaction_desc:0 "永久吞噬当前同座双生子，由我作为同一人物承接完整王权。双方必须是当前合法、已苏醒且互相对应的王座持有者；同一王座只能合一一次，死者不能再被唤醒。"
 mm_asc.0001.t:0 "王座后的低语"
 mm_asc.0001.desc:0 "体内龙血的残响又一次叩击我的思绪。它要求我放弃自己的判断，将身体与意志交给那古老的王座。我必须付出代价才能守住自我。"
 mm_asc.0001.a:0 "我的意志仍属于我。"
 mm_asc.0001.b:0 "听清它究竟想要什么……"
 mm_asc.0002.t:0 "自我执掌王座"
 mm_asc.0002.desc:0 "龙血终于与我的意志和解。我仍是我，名字与身份不因融合而被夺走。侵蚀与低语止息；我获得全部沐血之力，也能以同一身体在本人形貌与真实血源的龙形之间转换。"
 mm_asc.0002.a:0 "王座由我执掌。"
 mm_asc.0003.t:0 "旧名之下，新王复临"
 mm_asc.0003.desc:0 "侵蚀先于融合抵达终点。龙血的残留意志夺得主导，我承接实际血源的姓名与王权，成为新的龙王。身体默认呈现源龙形态，我仍能化为原本人形；过往父母、家族与其他祖源没有被抹去。"
 mm_asc.0003.a:0 "龙王的名字再次被呼唤。"
 mm_asc.0004.t:0 "王权来源无法确认"
 mm_asc.0004.desc:0 "龙血试炼已到达终点，但实际来源、形态记录或当前王权的归属出现冲突。试炼暂不写入结局，也不夺取他人王座或伪造姓名；融合仪式不会继续扣款。需要核对来源后再结算。"
 mm_asc.0004.a:0 "保留现有记录。"
