l_english:
 mm_wyvern_forge_dragon_treasures_decision:0 "Forge Dragon Treasures"
 mm_wyvern_forge_dragon_treasures_decision_desc:0 "Forge dragon teeth, claws, horns and scales into Draxel or Serind. The sword costs four artifacts; the bow costs three. Review the exact ingredients before choosing."
 mm_wyvern_forge_dragon_treasures_decision_tooltip:0 "Choose a dragon sword or bow"
 mm_wyvern_forge_dragon_treasures_decision_confirm:0 "Review recipes"
 mm_wyvern_dragon_forging.requirements:0 "Own unequipped fang x2 + claw x1 + horn x1, or scale x2 + horn x1. Every ingredient must be a distinct artifact; no heads or legacy eyes are consumed."
 mm_wyvern_dragon_forging.open:0 "Review both recipes. Canceling consumes nothing."
 mm_wyvern_dragon_forging.0001.t:0 "Dragonbone in the Forge"
 mm_wyvern_dragon_forging.0001.desc:0 "Draxel costs two fangs, one claw and one horn. Serind costs two scales and one horn. A dragon drops at most one of each material, so either recipe requires at least two kills.\n\nThe best available items of each kind are selected. Only the listed unequipped artifacts are consumed. The lowest ingredient rarity sets the result: common/masterwork use base stats; famed improves them by 25%, illustrious by 50%. Integer stats round up.\n\nSword bonus counts: 0/1/2/4. Bow bonus counts: 0/0/1/2. Fixed and random effects total at most 10 visible lines. The new weapon is not automatically equipped."
 mm_wyvern_dragon_forging.sword_materials:0 "\n\n#bold Sword ingredients:#!\n[scope:mm_wyvern_sword_fang.GetName] ([scope:mm_wyvern_sword_fang.GetRarity])\n[scope:mm_wyvern_sword_fang_second.GetName] ([scope:mm_wyvern_sword_fang_second.GetRarity])\n[scope:mm_wyvern_sword_claw.GetName] ([scope:mm_wyvern_sword_claw.GetRarity])\n[scope:mm_wyvern_sword_horn.GetName] ([scope:mm_wyvern_sword_horn.GetRarity])"
 mm_wyvern_dragon_forging.bow_materials:0 "\n\n#bold Bow ingredients:#!\n[scope:mm_wyvern_bow_scale.GetName] ([scope:mm_wyvern_bow_scale.GetRarity])\n[scope:mm_wyvern_bow_scale_second.GetName] ([scope:mm_wyvern_bow_scale_second.GetRarity])\n[scope:mm_wyvern_bow_horn.GetName] ([scope:mm_wyvern_bow_horn.GetRarity])"
 mm_wyvern_dragon_forging.0001.sword:0 "Forge Draxel"
 mm_wyvern_dragon_forging.0001.bow:0 "Craft Serind"
 mm_wyvern_dragon_forging.0001.cancel:0 "Put the materials away."
 mm_wyvern_dragon_forging.sword_stats:0 "Base: +15 Prowess, +0.8 monthly Prestige, +0.8 monthly Renown, +10% Heavy Infantry damage, +3 Advantage, +8% Heavy Infantry toughness. Better materials improve these values and add distinct random bonuses."
 mm_wyvern_dragon_forging.bow_stats:0 "Base: +5 Prowess, +12% Archer damage, +8% Archer toughness, +3 Advantage in each of forest/taiga/jungle, +5% Renown growth, +0.18 monthly Prestige. Each terrain counts as one effect. Better materials improve values and add bonuses."
 mm_wyvern_dragon_forging.complete:0 "A Dragon Treasure Forged"
 mm_wyvern_dragon_forging.complete_desc:0 "All listed ingredients have become a new weapon. Inspect its rarity and bonuses in your inventory."
 mm_wyvern_sword_name:0 "Draxel"
 mm_wyvern_sword_desc:0 "Dragon teeth run along a dark steel spine, while a great claw curves into the guard. Its heavy edge recalls the beast that once tore through armored prey."
 mm_wyvern_bow_name:0 "Serind"
 mm_wyvern_bow_desc:0 "A recurved bow of layered dragon horn, its limbs reinforced with scales. Its string hums like a low growl beneath the forest canopy."
 mm_wyvern_sword_common_modifier:0 "Draxel"
 mm_wyvern_sword_masterwork_modifier:0 "Draxel"
 mm_wyvern_sword_famed_modifier:0 "Draxel"
 mm_wyvern_sword_illustrious_modifier:0 "Draxel"
 mm_wyvern_bow_common_modifier:0 "Serind"
 mm_wyvern_bow_masterwork_modifier:0 "Serind"
 mm_wyvern_bow_famed_modifier:0 "Serind"
 mm_wyvern_bow_illustrious_modifier:0 "Serind"
