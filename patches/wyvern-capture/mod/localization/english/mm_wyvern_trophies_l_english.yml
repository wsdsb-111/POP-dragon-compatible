 mm_wyvern_material_scale_name:0 "Scale of [mm_wyvern_trophy_source.GetFirstNameNoTooltip]"
 mm_wyvern_material_scale_desc:0 "$myv_wyvern_scale_desc$\n\nTaken from the wyvern [mm_wyvern_trophy_source.GetFirstNameNoTooltip]."
 mm_wyvern_material_blood_name:0 "Blood of [mm_wyvern_trophy_source.GetFirstNameNoTooltip]"
 mm_wyvern_material_blood_desc:0 "$myv_wyvern_blood_desc$\n\nTaken from the wyvern [mm_wyvern_trophy_source.GetFirstNameNoTooltip]."
 mm_wyvern_trophy_claw_name:0 "Claw of [mm_wyvern_trophy_source.GetFirstNameNoTooltip]"
 mm_wyvern_trophy_claw_desc:0 "A preserved wyvern talon with curved claws and armored scales.\n\nTaken from the wyvern [mm_wyvern_trophy_source.GetFirstNameNoTooltip]."
 trait_mm_wyvern_bathed_in_dragon_blood:0 "Bathed in Dragon Blood"
 trait_mm_wyvern_bathed_in_dragon_blood_desc:0 "Having bathed in the blood of a slain legendary wyvern, this character has transcended a mortal lifespan and the loss of prowess with age. Dragon blood strengthens body and health, while the deed brings lasting renown."
