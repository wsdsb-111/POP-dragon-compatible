l_english:
 mm_wyvern_trophy_fang_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip] — Wyvern Fang"
 mm_wyvern_trophy_fang_desc:0 "A preserved wyvern fang taken from the wyvern [mm_wyvern_trophy_source.GetFirstNameNoTooltip]. This decorative trophy was collected after the creature was defeated and slain. It is separate from the original crafting materials."
 mm_wyvern_trophy_eye_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip] — Wyvern Eye"
 mm_wyvern_trophy_eye_desc:0 "A preserved wyvern eye taken from the wyvern [mm_wyvern_trophy_source.GetFirstNameNoTooltip]. This decorative trophy was collected after the creature was defeated and slain. It is separate from the original crafting materials."
 mm_wyvern_trophy_scale_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip] — Wyvern Scales"
 mm_wyvern_trophy_scale_desc:0 "A preserved wyvern scales taken from the wyvern [mm_wyvern_trophy_source.GetFirstNameNoTooltip]. This decorative trophy was collected after the creature was defeated and slain. It is separate from the original crafting materials."
 mm_wyvern_trophy_head_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip] — Wyvern Head"
 mm_wyvern_trophy_head_desc:0 "A complete preserved dragon bust, retaining its head, neck and original base for a court pedestal. Sand-gold brown scales, dark horns and aged teeth retain the dignity of an ancient beast.\n\nTaken from the wyvern [mm_wyvern_trophy_source.GetFirstNameNoTooltip]."
