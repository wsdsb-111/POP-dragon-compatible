l_english:
 mm_wyvern_feed_captive_interaction:0 "Feed Captured Wyvern"
 mm_wyvern_feed_captive_interaction_desc:0 "Offer food to the captured wild wyvern. Each effective meal restores its hunger and advances taming by 20. Five meals are needed before an attempt to bond."
 mm_wyvern_attempt_tame_captive_interaction:0 "Attempt to Tame Captured Wyvern"
 mm_wyvern_attempt_tame_captive_interaction_desc:0 "Attempt a temperament-specific scheme to establish a bond with the captured wyvern."
 mm_wyvern_capture.tame_success_tt:0 "Establish a bond and tame this wyvern, preserving its identity and injuries. A stabled wyvern resumes the original stable supply rules."
 mm_wyvern_attempt_tame_captive_interaction_desc_alert:0 "Use intrigue to approach the alert wyvern carefully."
 mm_wyvern_attempt_tame_captive_interaction_desc_docile:0 "Use stewardship to build trust with the docile wyvern."
 mm_wyvern_attempt_tame_captive_interaction_desc_fierce:0 "Use martial skill to master the fierce wyvern."
 mm_wyvern_tame_alert_captive_desc:0 "Carefully win the confidence of an alert captured wyvern."
 mm_wyvern_tame_docile_captive_desc:0 "Build a steady bond with a docile captured wyvern."
 mm_wyvern_tame_fierce_captive_desc:0 "Prove strength and resolve to a fierce captured wyvern."
 MM_WYVERN_TAME_CAPTIVE_SUCCESS_DESC:0 "The captured wyvern accepts you as its keeper."
 mm_wyvern_capture.0001.t:0 "Feed the Captured Wyvern"
 mm_wyvern_capture.0001.desc:0 "The caged wyvern watches as food is brought forward. A meal restores its hunger and helps it grow accustomed to your presence."
 mm_wyvern_capture.0001.scraps:0 "Feed scraps (up to +20 taming progress)"
 mm_wyvern_capture.0001.scraps_provisions:0 "Feed scraps from the camp stores (up to +20 taming progress)"
 mm_wyvern_capture.0001.standard:0 "Feed a proper meal (up to +20 taming progress)"
 mm_wyvern_capture.0001.standard_provisions:0 "Feed a proper meal from the camp stores (up to +20 taming progress)"
 mm_wyvern_capture.0001.prime:0 "Feed a prime cut (up to +20 taming progress)"
 mm_wyvern_capture.0001.prime_provisions:0 "Feed a prime cut from the camp stores (up to +20 taming progress)"
 mm_wyvern_capture.0001.cancel:0 "Leave the meal for another time"
 mm_wyvern_capture.feed_progress_tt:0 "If the wyvern is alive, hungry, and still in your cage, this meal restores 20 hunger. While taming progress is below 100, it also adds 20 progress, capped at 100."
 mm_wyvern_capture.0002.t:0 "A Wyvern's Trust"
 mm_wyvern_capture.0002.desc:0 "The wyvern lowers its head and accepts your presence. Your bond is now established."
 mm_wyvern_capture.0002.a:0 "Welcome, my companion"
 mm_wyvern_capture.0003.t:0 "The Wyvern Strikes"
 mm_wyvern_capture.0003.desc:0 "The attempt to tame the wyvern has failed. It lashes out before it can be restrained."
 mm_wyvern_capture.0003.a:0 "Get away from it!"
 trait_mm_wyvern_legendary_origin:0 "Legendary Origin"
 trait_mm_wyvern_legendary_origin_desc:0 "Legendary dragon blood may pass through eggs, but grants no named throne or royal immortality.\n\n#bold Combined positive effects with Tamed Wyvern:#!\nHealth: #P +5#!\nLife expectancy: #P +200 years#!\nStress gain: #P -100%#!\nEnemy hostile scheme initial success chance: #P -100%#!\nTravel speed: #P +200#!\nTravel safety: #P +1000#!\nRetains disease immunity.\n\nThis bloodline only adds the health difference; these are combined totals, not additional stacking bonuses. True royal dragons retain immortality and power through their separate royal trait. This bloodline adds no fertility, marriage or title inheritance restrictions."
 mm_wyvern_tame_alert_captive:0 "Tame Alert Captured Wyvern"
 mm_wyvern_tame_alert_captive_action:0 "Tame Wyvern"
 mm_wyvern_tame_alert_captive_desc_general:0 "$mm_wyvern_tame_alert_captive_desc$"
 mm_wyvern_tame_docile_captive:0 "Tame Docile Captured Wyvern"
 mm_wyvern_tame_docile_captive_action:0 "Tame Wyvern"
 mm_wyvern_tame_docile_captive_desc_general:0 "$mm_wyvern_tame_docile_captive_desc$"
 mm_wyvern_tame_fierce_captive:0 "Tame Fierce Captured Wyvern"
 mm_wyvern_tame_fierce_captive_action:0 "Tame Wyvern"
 mm_wyvern_tame_fierce_captive_desc_general:0 "$mm_wyvern_tame_fierce_captive_desc$"

 mm_wyvern_set_war_mount_desc:0 "Designate this wyvern as a war mount, preserving Harmony, rider Prowess and battlefield events. A wyvern already deployed as an independent knight must leave its army first. A wyvern cannot fill both roles. After cancelling this designation, an adult tamed wyvern can join its employer court knight roster."

 myv_wyvern_hungry_desc:0 "Below 50/30/20/10 satiety, ordinary dragons retain 90/70/50/25 percent power, while royal and legendary blood retains 95/80/60/50 percent. Exact thresholds use the previous tier. Malnutrition and injuries remain separate multipliers."

 myv_slay_wyvern_interaction_desc:0 "Challenge this wyvern. An on-foot human needs more than 30 Prowess to finish an ordinary wyvern, or more than 60 for legendary blood. Qualification does not guarantee survival. Very hungry wyverns are weaker, but legendary blood remains dangerous. Mounted aerial duels retain their separate rules."

 myv_cancel_wyvern_war_mount_interaction_desc:0 "Cancel this war-mount designation and remove its rider bonus. Unassigned adult tamed wyverns can serve as independent knights in their employer court; allow, force or forbid them in the knight roster. Juvenile, wild and travelling wyverns cannot serve independently."
