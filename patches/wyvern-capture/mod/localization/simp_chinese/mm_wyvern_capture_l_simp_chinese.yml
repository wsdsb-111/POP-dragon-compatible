l_simp_chinese:
 mm_wyvern_feed_captive_interaction:0 "喂养俘获的飞龙"
 mm_wyvern_feed_captive_interaction_desc:0 "给被俘的野生飞龙喂食。每次有效喂养恢复饥饿度并增加20点驯化进度。完成五次喂养后即可尝试建立羁绊。"
 mm_wyvern_attempt_tame_captive_interaction:0 "尝试驯服俘获的飞龙"
 mm_wyvern_attempt_tame_captive_interaction_desc:0 "根据飞龙的性情，通过相应的计谋尝试建立羁绊。"
 mm_wyvern_capture.tame_success_tt:0 "与这头飞龙建立羁绊，使其成为已驯服的飞龙，保留其身份和伤势。兽栏中的飞龙接回原有供粮规则。"
 mm_wyvern_attempt_tame_captive_interaction_desc_alert:0 "以计谋接近警觉的飞龙。"
 mm_wyvern_attempt_tame_captive_interaction_desc_docile:0 "以管理与耐心取得温顺飞龙的信任。"
 mm_wyvern_attempt_tame_captive_interaction_desc_fierce:0 "以军事本领和决心降服凶猛的飞龙。"
 mm_wyvern_tame_alert_captive_desc:0 "谨慎赢得警觉的俘获飞龙的信任。"
 mm_wyvern_tame_docile_captive_desc:0 "与温顺的俘获飞龙建立稳定羁绊。"
 mm_wyvern_tame_fierce_captive_desc:0 "向凶猛的俘获飞龙证明力量与决心。"
 MM_WYVERN_TAME_CAPTIVE_SUCCESS_DESC:0 "俘获的飞龙接受你成为它的饲主。"
 mm_wyvern_capture.0001.t:0 "喂养俘获的飞龙"
 mm_wyvern_capture.0001.desc:0 "笼中的飞龙注视着送来的食物。每次喂养都能恢复它的饥饿，并让它逐渐习惯你的存在。"
 mm_wyvern_capture.0001.scraps:0 "喂些残羹（驯化进度最多 +20）"
 mm_wyvern_capture.0001.scraps_provisions:0 "从营地储备中取些残羹（驯化进度最多 +20）"
 mm_wyvern_capture.0001.standard:0 "喂一顿正餐（驯化进度最多 +20）"
 mm_wyvern_capture.0001.standard_provisions:0 "从营地储备中取一顿正餐（驯化进度最多 +20）"
 mm_wyvern_capture.0001.prime:0 "喂一份上等肉食（驯化进度最多 +20）"
 mm_wyvern_capture.0001.prime_provisions:0 "从营地储备中取上等肉食（驯化进度最多 +20）"
 mm_wyvern_capture.0001.cancel:0 "改日再喂"
 mm_wyvern_capture.feed_progress_tt:0 "若飞龙仍然存活、饥饿且仍在你的笼中，此次喂养会恢复20点饥饿度。驯化进度低于100时额外增加20点，最多达到100。"
 mm_wyvern_capture.0002.t:0 "飞龙的信任"
 mm_wyvern_capture.0002.desc:0 "飞龙低下头，接受了你的接近。你们之间已建立羁绊。"
 mm_wyvern_capture.0002.a:0 "欢迎成为我的伙伴"
 mm_wyvern_capture.0003.t:0 "飞龙反击"
 mm_wyvern_capture.0003.desc:0 "驯服飞龙的尝试失败了。它在被制服前猛烈反击。"
 mm_wyvern_capture.0003.a:0 "快离开它！"
 trait_mm_wyvern_legendary_origin:0 "传奇血脉"
 trait_mm_wyvern_legendary_origin_desc:0 "古老龙族的传奇血统，可随龙蛋传给后代，但不会自动获得具名王座或龙王永生。\n\n#bold 与“已驯服飞龙”合计的正面效果：#!\n健康：#P +5#!\n预期寿命：#P +200年#!\n压力增加值：#P -100%#!\n敌方阴谋初始成功率：#P -100%#!\n旅行速度：#P +200#!\n旅行安全性：#P +1000#!\n保留疾病免疫。\n\n血统只补足健康差额，以上为合计数值，不会重复叠加。真正龙王的永生与权能由其独立王权特质保留；血统本身不附加生育、婚姻或头衔继承限制。"
 mm_wyvern_tame_alert_captive:0 "驯服警觉的俘获飞龙"
 mm_wyvern_tame_alert_captive_action:0 "驯服飞龙"
 mm_wyvern_tame_alert_captive_desc_general:0 "$mm_wyvern_tame_alert_captive_desc$"
 mm_wyvern_tame_docile_captive:0 "驯服温顺的俘获飞龙"
 mm_wyvern_tame_docile_captive_action:0 "驯服飞龙"
 mm_wyvern_tame_docile_captive_desc_general:0 "$mm_wyvern_tame_docile_captive_desc$"
 mm_wyvern_tame_fierce_captive:0 "驯服凶猛的俘获飞龙"
 mm_wyvern_tame_fierce_captive_action:0 "驯服飞龙"
 mm_wyvern_tame_fierce_captive_desc_general:0 "$mm_wyvern_tame_fierce_captive_desc$"

 mm_wyvern_set_war_mount_desc:0 "指定这条龙作为战斗坐骑，继续使用原有默契、骑手勇武与战场事件。它若已独立作为骑士随军，须先退出军队；同一条龙不会同时充当坐骑和独立骑士。取消指定后，成年已驯服龙可进入所属宫廷的骑士候选名单。"

 myv_wyvern_hungry_desc:0 "饱食度低于50/30/20/10时，普通龙分别保留90%/70%/50%/25%战力，龙王及传奇血统分别保留95%/80%/60%/50%。等于阈值时按上一档计算；营养不良和伤势仍另行计算，饱食度本身不被营养不良冒充。"

 myv_slay_wyvern_interaction_desc:0 "挑战这头飞龙。徒步终结普通龙需要勇武超过30，终结传说龙需要超过60；达到门槛仍可能受伤或死亡。非常饥饿的龙更虚弱，但传说血脉仍然危险。骑乘飞龙的空战沿用独立规则。"

 myv_cancel_wyvern_war_mount_interaction_desc:0 "不再将这条龙指定为战斗坐骑，并清除对应骑手加成。无人指定的成年已驯服龙可作为所属宫廷的独立骑士，在骑士名单中允许、强制或禁止上阵；幼龙、野龙与旅行中的龙不能独立上阵。"
