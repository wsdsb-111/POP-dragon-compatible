l_simp_chinese:
 mm_wyvern_trophy_fang_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙牙"
 mm_wyvern_trophy_fang_desc:0 "一枚经清理与镶嵌保存的龙牙。\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。这是击败并杀死该飞龙后保留的装饰战利品；与用于锻造的原生材料分别收藏。"
 mm_wyvern_trophy_eye_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙眼"
 mm_wyvern_trophy_eye_desc:0 "一颗封存在古铜托座中的琥珀色龙眼。\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。这是击败并杀死该飞龙后保留的装饰战利品；与用于锻造的原生材料分别收藏。"
 mm_wyvern_trophy_scale_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙鳞"
 mm_wyvern_trophy_scale_desc:0 "一组装裱保存的坚硬龙鳞。\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。这是击败并杀死该飞龙后保留的装饰战利品；与用于锻造的原生材料分别收藏。"
 mm_wyvern_trophy_head_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙头"
 mm_wyvern_trophy_head_desc:0 "完整保存头部、颈部与原有基座的飞龙猎获物，供宫廷展台陈列。沙金褐鳞片、黑褐龙角与旧骨色牙齿仍显出古龙的威严。\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。"
 mm_wyvern_material_fang_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙牙"
 mm_wyvern_material_fang_desc:0 "$myv_wyvern_fang_desc$\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。"
 mm_wyvern_material_scale_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙鳞"
 mm_wyvern_material_scale_desc:0 "$myv_wyvern_scale_desc$\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。"
 mm_wyvern_material_blood_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙血"
 mm_wyvern_material_blood_desc:0 "$myv_wyvern_blood_desc$\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。"
 mm_wyvern_trophy_claw_name:0 "[mm_wyvern_trophy_source.GetFirstNameNoTooltip]之龙爪"
 mm_wyvern_trophy_claw_desc:0 "一件带有弯钩利爪和坚硬鳞甲的飞龙爪部陈列。\n\n取自飞龙「[mm_wyvern_trophy_source.GetFirstNameNoTooltip]」。"
 trait_mm_wyvern_bathed_in_dragon_blood:0 "沐浴龙血"
 trait_mm_wyvern_bathed_in_dragon_blood_desc:0 "沐浴击杀的传说飞龙之血，此人已超越凡躯的寿命，不因衰老失去勇武。龙血强化其健康与力量，屠龙壮举令其威名远扬。"
