l_simp_chinese:
 mm_wyvern_forge_dragon_treasures_decision:0 "锻造龙宝"
 mm_wyvern_forge_dragon_treasures_decision_desc:0 "将屠龙所得交给工匠，让利齿、龙角、鳞甲与利爪化为传世兵器。德拉克斯尔需要四件材料，瑟林德需要三件；你可以在下一步查看并选择。"
 mm_wyvern_forge_dragon_treasures_decision_tooltip:0 "选择以龙材锻造重剑或反曲弓"
 mm_wyvern_forge_dragon_treasures_decision_confirm:0 "查看配方"
 mm_wyvern_dragon_forging.requirements:0 "拥有未装备的龙牙×2＋龙爪×1＋龙角×1，或龙鳞×2＋龙角×1。每份必须是不同的宝物；不消耗龙头或旧龙眼。"
 mm_wyvern_dragon_forging.open:0 "打开锻造选择；查看材料后决定，取消不会消耗材料。"
 mm_wyvern_dragon_forging.0001.t:0 "龙骨入炉"
 mm_wyvern_dragon_forging.0001.desc:0 "工匠已经呈上配方。#bold 德拉克斯尔#!需龙牙×2、龙爪×1、龙角×1；#bold 瑟林德#!需龙鳞×2、龙角×1。同种材料每条飞龙最多掉落一件，因此至少需要猎杀两条飞龙。\n\n每类优先选品质最高的材料，只消耗下方列出的未装备宝物。成品品质取全部材料中的最低一档：普通／大师级保持基础数值，名作级提高25%，卓越提高50%；整数向上取整。\n\n品质越高，额外随机增益越多，全部可见属性合计最多10项。剑依品质额外获得0／1／2／4项，弓额外获得0／0／1／2项。成品为可装备武器，制作后不会自动装备。"
 mm_wyvern_dragon_forging.sword_materials:0 "\n\n#bold 重剑将消耗:#!\n[scope:mm_wyvern_sword_fang.GetName] ([scope:mm_wyvern_sword_fang.GetRarity])\n[scope:mm_wyvern_sword_fang_second.GetName] ([scope:mm_wyvern_sword_fang_second.GetRarity])\n[scope:mm_wyvern_sword_claw.GetName] ([scope:mm_wyvern_sword_claw.GetRarity])\n[scope:mm_wyvern_sword_horn.GetName] ([scope:mm_wyvern_sword_horn.GetRarity])"
 mm_wyvern_dragon_forging.bow_materials:0 "\n\n#bold 反曲弓将消耗:#!\n[scope:mm_wyvern_bow_scale.GetName] ([scope:mm_wyvern_bow_scale.GetRarity])\n[scope:mm_wyvern_bow_scale_second.GetName] ([scope:mm_wyvern_bow_scale_second.GetRarity])\n[scope:mm_wyvern_bow_horn.GetName] ([scope:mm_wyvern_bow_horn.GetRarity])"
 mm_wyvern_dragon_forging.0001.sword:0 "锻造德拉克斯尔"
 mm_wyvern_dragon_forging.0001.bow:0 "制作瑟林德"
 mm_wyvern_dragon_forging.0001.cancel:0 "暂且收起材料。"
 mm_wyvern_dragon_forging.sword_stats:0 "基础：勇武+15、每月威望+0.8、每月宗族威望+0.8、重步兵伤害+10%、战场优势+3、重步兵坚韧+8%。高级材料进一步增强这些数值，并抽取不同类别的额外增益。"
 mm_wyvern_dragon_forging.bow_stats:0 "基础：勇武+5、弓箭手伤害+12%、弓箭手坚韧+8%、森林／针叶林／丛林战场优势各+3、宗族威望增长+5%、每月威望+0.18。三种地形优势各计一项。高级材料进一步增强数值并增加随机增益。"
 mm_wyvern_dragon_forging.complete:0 "龙宝铸成"
 mm_wyvern_dragon_forging.complete_desc:0 "所列材料已经全部融入新武器。你可以在宝物栏查看其品质和增益。"
 mm_wyvern_sword_name:0 "德拉克斯尔"
 mm_wyvern_sword_desc:0 "龙牙嵌入乌钢剑脊，龙爪化作弯曲的护手。厚重的剑锋仍有猛兽撕裂鳞甲的威势；持剑者以凡人之手，续写屠龙者的传说。"
 mm_wyvern_bow_name:0 "瑟林德"
 mm_wyvern_bow_desc:0 "以层叠龙角为骨，以坚鳞加固弓臂。这柄反曲弓弦声低沉，如密林中压抑的龙鸣；箭离弦时，猎物才会知道自己已被盯上。"
 mm_wyvern_sword_common_modifier:0 "德拉克斯尔"
 mm_wyvern_sword_masterwork_modifier:0 "德拉克斯尔"
 mm_wyvern_sword_famed_modifier:0 "德拉克斯尔"
 mm_wyvern_sword_illustrious_modifier:0 "德拉克斯尔"
 mm_wyvern_bow_common_modifier:0 "瑟林德"
 mm_wyvern_bow_masterwork_modifier:0 "瑟林德"
 mm_wyvern_bow_famed_modifier:0 "瑟林德"
 mm_wyvern_bow_illustrious_modifier:0 "瑟林德"
