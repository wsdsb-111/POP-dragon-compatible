l_english:
 trait_mm_dragon_death_servant:0 "Death Servant"
 trait_mm_dragon_death_servant_desc:0 "Unstable dragon blood has irreversibly consumed this mind. Kinship and the original blood source remain. Attacks one to three local NPCs daily, prioritizing untitled wanderers outside courts; powerful dragon blood must be overcome in combat. Roams through ordinary travel without a speed bonus."
