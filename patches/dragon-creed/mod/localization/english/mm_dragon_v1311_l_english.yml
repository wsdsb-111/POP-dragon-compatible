l_english:
 mm_tenet_black_name:0 "Bloodline Supremacy"
 mm_tenet_black_desc:0 "In patched dragon hunts and mounted aerial duels, suppress non-Founder dragon-blood opponents by 20%. Defeating a non-Founder wild dragon grants 5 Spiritual Fulfillment. Native army combat and ordinary duels are not covered."
 mm_tenet_black_second_name:0 "Covenant of Pure Blood"
 mm_tenet_black_second_desc:0 "A Covenant parent increases mixed-offspring black mutation from 10% to 20%. Two black-blood parents always produce black blood. A single-black pairing uses one tier below the other parent, or C with an ordinary human, then rolls mutation. Non-black offspring retain a separate 25% chance to exceed the stronger parent by one grade, capped at S. Direct dragon S and royal first-generation offspring keep priority. Children with a non-dragon-blood parent receive a permanent -1 to all six skills."
 mm_tenet_black_third_name:0 "Judgment of Usurpation"
 mm_tenet_black_third_desc:0 "In patched hunts and aerial duels, gain 30% combat power against Death Servants. An identified Founder executioner gains 10 Spiritual Fulfillment for executing another rite of this faith. Absorbing an eligible same-faith, different-rite victim reduces that promotion threshold by 30%."
 mm_tenet_white_name:0 "Mental Resonance"
 mm_tenet_white_desc:0 "Stress loss +50%, stress gain -50%, general opinion +10."
 mm_tenet_white_second_name:0 "Awakening of Spirit Blood"
 mm_tenet_white_second_desc:0 "Learning +5; monthly Spiritual Fulfillment +1; Death Servant mutation chances during stress breakdowns are halved."
 mm_tenet_white_third_name:0 "Absolution of Consciousness"
 mm_tenet_white_third_desc:0 "White-rite characters with biological White blood may erase a target mind to gain a strong hook. Cooldown: five years."
 mm_tenet_fire_name:0 "Tempered Dragonfire"
 mm_tenet_fire_desc:0 "Construction time -15%, construction gold cost -10%, artifact durability decay -50%."
 mm_tenet_fire_second_name:0 "Ancestral Blood Heirs"
 mm_tenet_fire_second_desc:0 "Landed rulers gain +2 to all six skills per dynasty renown level, capped at +10, and +5% prestige and legitimacy gain per level, capped at +25%. Checked monthly."
 mm_tenet_fire_third_name:0 "Purifying Flame"
 mm_tenet_fire_third_desc:0 "Killing a Death Servant or a same-dynasty character with current provable criminal grounds grants 200 dynasty renown and 10 Spiritual Fulfillment. Acquiring an illustrious artifact through the ownership callback grants the same reward. A Death Servant is not counted twice."
 mm_tenet_earth_name:0 "Repose of the Ley Lines"
 mm_tenet_earth_desc:0 "Army toughness +10%; monthly piety +10%."
 mm_tenet_earth_second_name:0 "Heirs of the Earth"
 mm_tenet_earth_second_desc:0 "Childbirth or completing a hosted funeral grants 150 prestige, 150 piety and 100 legitimacy, plus one +1 stack to all six skills, capped at five. Each funeral pays once per activity."
 mm_tenet_earth_third_name:0 "Sealed Earth"
 mm_tenet_earth_third_desc:0 "Completing a building grants 3 Spiritual Fulfillment. Earth-rite vassals have -20 acceptance when their actual liege or superior demands conversion."
 mm_tenet_sea_name:0 "Tidal Hegemony"
 mm_tenet_sea_desc:0 "Travel safety +30; stewardship +5. Trade-route income +20% is pending."
 mm_tenet_sea_second_name:0 "Sea-Blood Marriage"
 mm_tenet_sea_second_desc:0 "General opinion +20, including dragons. Remove the old -25 human-dragon religious marriage penalty and add 20 acceptance."
 mm_tenet_sea_third_name:0 "Grace of the Sea"
 mm_tenet_sea_third_desc:0 "Attraction +10; fertility +20%. Gaining a lover or soulmate grants 3 Spiritual Fulfillment and removes 30 stress. In the patched native adult intimacy effect, each Sea-rite participant gains 5 Spiritual Fulfillment."
 mm_tenet_sky_name:0 "Lightness of Wind"
 mm_tenet_sky_desc:0 "True-dragon agility +10%, travel speed +20%, army movement speed +10%. Each patched dragon-injury path has a 20% chance to avoid damage."
 mm_tenet_sky_second_name:0 "Blood Tempered in Battle"
 mm_tenet_sky_second_desc:0 "An identified living killer gains 10 Spiritual Fulfillment on a recorded battle kill. Dragon injury recovery averages 10% faster through integer accumulation. Intimidated and terrified vassal taxes +10%. Together with Wings of the Storm, deposited raid loot grants 50% extra gold."
 mm_tenet_sky_third_name:0 "Blood Eagle Judgment"
 mm_tenet_sky_third_desc:0 "Execute an imprisoned adherent of this faith to gain 20% of each current skill, rounded down, for three years. Cannot repeat while this boon is active."
 mm_doctrine_black_name:0 "Return of the Progenitor"
 mm_doctrine_black_desc:0 "Founder rite adherents gain monthly piety +25%. Baghdad grants landed rulers +5 to all six skills and +10% prestige and piety gain. The Founder may target the other five rites with the three patched religious wars without piety cost; all other native CB conditions remain. Different-faith or different-rite counties in the realm convert 50% faster while Baghdad is controlled."
 mm_doctrine_white_name:0 "Oracle Against Fate"
 mm_doctrine_white_desc:0 "Landed rulers gain intrigue +4 and diplomacy +3 and slowly proselytize. Sagami unlocks Mental Infection and 50% faster conversion of different-faith or different-rite counties in the realm. White adherents have an additional -30 opinion of Founder adherents, refreshed monthly; this does not change White war eligibility."
 mm_doctrine_fire_name:0 "Art of Dragon Forging"
 mm_doctrine_fire_desc:0 "Jingzhao grants domain tax +20%, construction time and cost -30%. Dragon Inscription costs 500 piety and adds prowess +2 to equipped uninscribed artifacts. Unfinished weapon inspirations gain 40% more expected monthly progress. Sponsored weapons, armor and bows with a common or masterwork result have a 30% chance to advance one grade; famed and illustrious results remain unchanged.\n\n$mm_v1312_fire_equipment_quality_desc$"
 mm_doctrine_earth_name:0 "Order of the Underworld"
 mm_doctrine_earth_desc:0 "Monthly control growth +30%. Positive discontent growth against Earth rulers is reduced by 40% for the patched native and Hanfan factions; negative decay is unchanged. Qus grants a 15% pre-death survival chance in covered hunts, aerial and battlefield encounters, with prowess +5 and martial +3 for three years."
 mm_doctrine_sea_name:0 "Oath of the Tide"
 mm_doctrine_sea_desc:0 "Travel speed +20%. Directly held coastal counties gain +10% tax, with another +20% when Crete is controlled, plus construction cost -30%. County effects refresh monthly and expire within two months after eligibility changes."
 mm_doctrine_sky_name:0 "Wings of the Storm"
 mm_doctrine_sky_desc:0 "Prowess +5 and army damage +15%. Landed Storm adherents gain movement speed +15% and another +5 prowess while Sogn is controlled. Combined raid-deposit income is +50%. Fixed -2 winter supply loss and river supply reduction remain pending; there is currently no winter supply reduction."
 mm_dragon_rite_doctrine_name:0 "Doctrine of the Thrones"
