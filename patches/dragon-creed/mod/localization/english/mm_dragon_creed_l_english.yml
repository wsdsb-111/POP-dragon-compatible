 mm_dragon_creed_religion_adj:0 "Dragon Creed"
 mm_dragon_creed_religion_adherent:0 "Dragon Creed adherent"
 mm_dragon_creed_religion_adherent_plural:0 "Dragon Creed adherents"
 mm_dragon_creed_religion_desc:0 "The Dragon Creed preserves the history of the ancestor and twin dragon kings. The Black Emperor and White Empress remain dormant; divine union and return from war are awakenings, not resurrection. The faiths are public; secrecy concerns their lore. Twin devouring is accepted, usurpation demands trial, blood must continue, all return to the ancestor, and secrets must be guarded. Human marriage is disapproved of but not forbidden."
 mm_dragon_fire:0 "Forged Fire"
 mm_dragon_fire_adj:0 "Forged Fire"
 mm_dragon_fire_adherent:0 "Forged Fire"
 mm_dragon_fire_adherent_plural:0 "Forged Fire"
 mm_dragon_fire_desc:0 "In temples from Han lands to Persia, the Forged Fire makes sacred works and records the twin dragon kings in flame. Its adherents guard dragon history while openly honoring craft and construction."
 mm_dragon_earth:0 "Underworld"
 mm_dragon_earth_adj:0 "Underworld"
 mm_dragon_earth_adherent:0 "Underworld"
 mm_dragon_earth_adherent_plural:0 "Underworld"
 mm_dragon_earth_desc:0 "The Underworld guards Egyptian tombs and ancient Nibelungen sites, treating slumber as watchfulness rather than resurrection. Adherents openly tend graves and preserve the dragons’ origins in secret."
 mm_dragon_sea:0 "Raging Tide"
 mm_dragon_sea_adj:0 "Raging Tide"
 mm_dragon_sea_adherent:0 "Raging Tide"
 mm_dragon_sea_adherent_plural:0 "Raging Tide"
 mm_dragon_sea_desc:0 "In Greek and Italian ports the Raging Tide honors the twin dragon kings through voyages, trade and maritime power. Dragon history is guarded behind public seafaring rites."
 mm_dragon_sky:0 "Storm"
 mm_dragon_sky_adj:0 "Storm"
 mm_dragon_sky_adherent:0 "Storm"
 mm_dragon_sky_adherent_plural:0 "Storm"
 mm_dragon_sky_desc:0 "In the north, the Storm celebrates conquest against fate, swiftness and the courage of the twin dragon kings. Adherents guard dragon history, while their faith is publicly practiced."
 mm_dragon_black:0 "Primordial Orthodoxy"
 mm_dragon_black_adj:0 "Primordial Orthodoxy"
 mm_dragon_black_adherent:0 "Primordial Orthodoxy"
 mm_dragon_black_adherent_plural:0 "Primordial Orthodoxy"
 mm_dragon_black_desc:0 "Primordial Orthodoxy guards the ancient dragon order and awaits the ancestor’s unity and awakening. The Black Emperor remains dormant, not dead; the tradition is secret, but the faith is public."
 mm_dragon_white:0 "White Empress Oracle"
 mm_dragon_white_adj:0 "White Empress Oracle"
 mm_dragon_white_adherent:0 "White Empress Oracle"
 mm_dragon_white_adherent_plural:0 "White Empress Oracle"
 mm_dragon_white_desc:0 "In Japan the White Empress Oracle preserves rebellion and spiritual freedom, challenging fate through prophecy. The White Empress remains dormant, not dead; adherents keep dragon history secret while practicing publicly."
 mm_tenet_blood_purification_name:0 "Purification of Blood"
 mm_tenet_blood_purification_desc:0 "Blood purification honors lineage; fertility +5%. This effect does not measure blood purity."
 mm_tenet_death_servant_punishment_name:0 "Punishment of Death Servants"
 mm_tenet_death_servant_punishment_desc:0 "Punishment of death servants: dread gain +5%."
