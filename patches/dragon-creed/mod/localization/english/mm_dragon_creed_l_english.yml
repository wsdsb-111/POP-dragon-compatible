l_english:
 mm_dragon_creed:0 "Dragon Creed"
 mm_dragon_creed_desc:0 "The Dragon Creed preserves the history of the ancestor and twin dragon kings. The Black Emperor and White Empress remain dormant; divine union and return from war are awakenings, not resurrection. The faiths are public; secrecy concerns their lore. Twin devouring is accepted, usurpation demands trial, blood must continue, all return to the ancestor, and secrets must be guarded. Human marriage is disapproved of but not forbidden."
 mm_dragon_creed_adj:0 "Dragon Creed"
 mm_dragon_creed_adherent:0 "Dragon Creed"
