l_simp_chinese:
 mm_dragon_creed:0 "龙之信条"
 mm_dragon_creed_desc:0 "龙之信条传承始祖与双生龙王的历史。黑皇与白皇仍在蛰眠；神圣结合与战归是觉醒，并非死者复生。各教派公开存在，守秘仅为龙史的设定。双生相噬可被接受；篡位须经试炼，血脉须延续，终将归于始祖，秘密应当守护。与人类通婚不受禁止，但不受赞许。"
 mm_dragon_creed_adj:0 "龙之信条"
 mm_dragon_creed_adherent:0 "龙之信条"
 mm_dragon_creed_adherent_plural:0 "龙之信条"
 mm_dragon_creed_religion:0 "龙之信条"
 mm_dragon_creed_religion_adj:0 "龙之信条"
 mm_dragon_creed_religion_adherent:0 "龙信徒"
 mm_dragon_creed_religion_adherent_plural:0 "龙信徒"
 mm_dragon_creed_religion_desc:0 "龙之信条传承始祖与双生龙王的历史。黑皇与白皇仍在蛰眠；神圣结合与战归是觉醒，并非死者复生。各教派公开存在，守秘仅为龙史的设定。双生相噬可被接受；篡位须经试炼，血脉须延续，终将归于始祖，秘密应当守护。与人类通婚不受禁止，但不受赞许。"
 mm_dragon_fire:0 "铸火宗"
 mm_dragon_fire_adj:0 "铸火宗"
 mm_dragon_fire_adherent:0 "铸火宗"
 mm_dragon_fire_adherent_plural:0 "铸火宗"
 mm_dragon_fire_desc:0 "铸火宗在汉地与波斯的宗庙中锻造祭器，以炉火记述双生龙王的传承。信徒谨守龙族秘史，却公开奉行铸造与营建之道。"
 mm_dragon_earth:0 "冥府宗"
 mm_dragon_earth_adj:0 "冥府宗"
 mm_dragon_earth_adherent:0 "冥府宗"
 mm_dragon_earth_adherent_plural:0 "冥府宗"
 mm_dragon_earth_desc:0 "冥府宗守护埃及的墓所与尼伯龙根的古老遗迹，将沉眠视为守望，而非死者复生。信徒公开守墓，秘传龙族起源。"
 mm_dragon_sea:0 "怒潮宗"
 mm_dragon_sea_adj:0 "怒潮宗"
 mm_dragon_sea_adherent:0 "怒潮宗"
 mm_dragon_sea_adherent_plural:0 "怒潮宗"
 mm_dragon_sea_desc:0 "怒潮宗在希腊与意大利的港口传颂双生龙王，以航行、贸易和海上权势维系信仰。龙族秘史藏于公开的航海仪礼之后。"
 mm_dragon_sky:0 "风暴宗"
 mm_dragon_sky_adj:0 "风暴宗"
 mm_dragon_sky_adherent:0 "风暴宗"
 mm_dragon_sky_adherent_plural:0 "风暴宗"
 mm_dragon_sky_desc:0 "风暴宗在北欧传颂逆命征伐，崇尚迅捷、勇气与双生龙王的意志。龙族秘史由信徒谨慎传承，公开的信仰并非隐秘组织。"
 mm_dragon_black:0 "始祖正统派"
 mm_dragon_black_adj:0 "始祖正统派"
 mm_dragon_black_adherent:0 "始祖正统派"
 mm_dragon_black_adherent_plural:0 "始祖正统派"
 mm_dragon_black_desc:0 "始祖正统派守护古老龙族秩序，等待始祖的归一与觉醒。黑皇仍在蛰眠，并未死去；秘密是传承的内容，并不隐藏教派存在。"
 mm_dragon_white:0 "白皇神谕派"
 mm_dragon_white_adj:0 "白皇神谕派"
 mm_dragon_white_adherent:0 "白皇神谕派"
 mm_dragon_white_adherent_plural:0 "白皇神谕派"
 mm_dragon_white_desc:0 "白皇神谕派在日本传承反叛与精神自由，以神谕挑战既定命运。白皇仍在蛰眠，并未死去；信徒秘密保存龙史，公开奉行教义。"
