l_simp_chinese:
 mm_tenet_black_name:0 "血脉压制"
 mm_tenet_black_desc:0 "在兼容补丁接管的猎龙与骑龙空战中，对非始祖派的龙族或混血敌手压制20%战力；击败非始祖派野龙获得5灵性满足。原生军阵和普通人物决斗尚不受该战力压制。"
 mm_tenet_black_second_name:0 "纯血圣约"
 mm_tenet_black_second_desc:0 "至少一位亲本奉行纯血圣约时，混血后代的黑血突变率由10%提高至20%。双黑血亲本的子女必为黑血；单黑血配对按另一方血统降一级，另一方为普通人时基础为C级，再作突变判定。非黑血子代保留25%机会高于更强亲本一级、最高S级的加成。真龙直系S、龙王直系初代种优先。与无龙血者生育的子代终身六项属性-1。"
 mm_tenet_black_third_name:0 "僭越审判"
 mm_tenet_black_third_desc:0 "猎龙与骑龙空战对死侍战力+30%；始祖派处决同信仰其他礼仪信徒获得10灵性满足；吸收合法异端猎物本次晋级阈值-30%。"
 mm_tenet_white_name:0 "精神共鸣"
 mm_tenet_white_desc:0 "压力损失+50%，压力获得-50%，他人好感+10。"
 mm_tenet_white_second_name:0 "灵血觉醒"
 mm_tenet_white_second_desc:0 "学识+5，每月灵性满足+1；压力崩溃时死侍突变概率减半。"
 mm_tenet_white_third_name:0 "意识涤罪"
 mm_tenet_white_third_desc:0 "白皇生物血脉且属于白皇派的成年角色可使用精神抹除，取得强牵制；冷却5年。"
 mm_tenet_fire_name:0 "百炼龙火"
 mm_tenet_fire_desc:0 "建造时间-15%，建造金币费用-10%，宝物耐久消耗-50%。"
 mm_tenet_fire_second_name:0 "宗庙血嗣"
 mm_tenet_fire_second_desc:0 "有地统治者按宗族威望等级每级获得六项属性+2，最高+10；每级威望与正统度获取+5%，最高+25%。每月复核。"
 mm_tenet_fire_third_name:0 "焰刑正俗"
 mm_tenet_fire_third_desc:0 "杀死死侍，或杀死有明确犯罪证据的同宗族成员，或通过所有权回调取得卓越宝物，获得200宗族威望与10灵性满足；同一死侍不重复计为同宗罪犯。"
 mm_tenet_earth_name:0 "地脉安魂"
 mm_tenet_earth_desc:0 "军队坚韧+10%，每月虔诚+10%。"
 mm_tenet_earth_second_name:0 "地脉承嗣"
 mm_tenet_earth_second_desc:0 "生育及完成一场主持的葬礼，各获得150威望、150虔诚和100正统度，并增加一层六属性+1，最多五层；同一葬礼按活动去重。"
 mm_tenet_earth_third_name:0 "地之封闭"
 mm_tenet_earth_third_desc:0 "建筑完成获得3灵性满足；冥府封臣被实际领主或上级要求改信时额外-20接受度。"
 mm_tenet_sea_name:0 "潮汐霸权"
 mm_tenet_sea_desc:0 "旅行安全+30，管理+5；贸易路线收入+20%仍待对应机制接入。"
 mm_tenet_sea_second_name:0 "海脉联姻"
 mm_tenet_sea_second_desc:0 "一般好感+20（含龙族）；人龙婚配取消原-25宗教惩罚，另加20接受度。"
 mm_tenet_sea_third_name:0 "海之风韵"
 mm_tenet_sea_third_desc:0 "吸引力+10、生育力+20%；取得情人或灵魂伴侣时灵性+3、压力-30；接入的原生双成年人亲密效果中，双方各按自身礼仪获得5灵性。"
 mm_tenet_sky_name:0 "风之轻盈"
 mm_tenet_sky_desc:0 "真龙敏捷+10%，旅行速度+20%，军队移动速度+10%；兼容补丁的三类龙伤路径逐次有20%机会免伤。"
 mm_tenet_sky_second_name:0 "战血淬炼"
 mm_tenet_sky_second_desc:0 "原生战死记录具有明确在世击杀者时，击杀获得10灵性满足；龙伤恢复平均加快10%，以整数余数累计。恐惧及畏缩封臣税收+10%；信条与风暴教义合计在劫掠送达时追加50%金币。"
 mm_tenet_sky_third_name:0 "血鹰裁决"
 mm_tenet_sky_third_desc:0 "可处决同信仰的在押囚犯，获得其六项当前属性各20%（向下取整）的三年加成；加成期间不能再次裁决。"
 mm_doctrine_black_name:0 "始祖再临"
 mm_doctrine_black_desc:0 "始祖正统派信众每月虔诚+25%；控制巴格达的有地统治者六属性+5、威望与虔诚获取+10%；对同信仰其他礼仪的三种合法原生宗教战争最终虔诚费用归零；己方领地内不同信仰或礼仪县改信速度+50%。宣战许可保持原生。"
 mm_doctrine_white_name:0 "逆命神谕"
 mm_doctrine_white_desc:0 "有地统治者阴谋+4、外交+3并缓慢传教；相模圣地解锁精神侵染，并使己方领地内不同信仰或礼仪县改信速度+50%；白派对始祖派额外-30好感，月度复核，不改变宣战许可。"
 mm_doctrine_fire_name:0 "铸火匠心"
 mm_doctrine_fire_desc:0 "京兆圣地领地税+20%、建造时间与费用-30%；龙文铸兵消耗500虔诚，为已装备未铭刻宝物加勇武2；武器灵感在未完成阶段月均进度+40%；火派赞助的武器、护甲、弓，普通或优质结果有30%概率升一档，名作及卓越不变。\n\n$mm_v1312_fire_equipment_quality_desc$"
 mm_doctrine_earth_name:0 "冥府守序"
 mm_doctrine_earth_desc:0 "县控制增长+30%；针对冥府统治者的原生及汉番派系，不满正增长-40%，负衰减不变；古斯圣地为已接入猎龙、空战及阵战的致命结果增加15%生还机会，临时勇武+5军略+3三年。"
 mm_doctrine_sea_name:0 "怒潮之誓"
 mm_doctrine_sea_desc:0 "旅行速度+20%；直接持有的沿海县税收+10%，控制克里特圣地后额外+20%，并获得建造费用-30%。沿海县加成每月复核，离开条件后最多两个月失效。"
 mm_doctrine_sky_name:0 "风暴之翼"
 mm_doctrine_sky_desc:0 "勇武+5、军队伤害+15%；控制松恩圣地的风暴派有地统治者额外移动+15%、勇武+5。与信条合计劫掠送达多获50%金币。冬季补给固定-2及渡河补给均待实现；目前没有冬季补给减免。"
 mm_dragon_rite_doctrine_name:0 "王座教义"
