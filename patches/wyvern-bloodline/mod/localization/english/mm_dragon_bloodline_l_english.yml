 trait_mm_dragon_branch_white:0 "White Empress Branch"

 trait_mm_dragon_branch_white_desc:0 "This lineage arose from human research into blood recovered from the White Empress's sacred remains. Researchers created monsters with that blood, then caused humans to conceive those monsters' children, establishing a continuing mixed lineage. These families are not natural offspring of the White Empress and humans. The Empress is recorded as the source of their power, not their biological mother."

 trait_mm_dragon_branch_white_biological_desc:0 "$trait_mm_dragon_branch_white_desc$\n\nThe engineered lineage can pass to human descendants; provenance does not rewrite their actual parents or House."

 trait_mm_dragon_branch_white_acquired_desc:0 "$trait_mm_dragon_branch_white_desc$\n\nThis is acquired blood, not biological ancestry. It is not automatically inherited by ordinary human descendants."

 trait_mm_dragon_branch_black:0 "Black Emperor Branch"

 trait_mm_dragon_branch_black_desc:0 "The Black Emperor has no default naturally generated mixed families. A Black Blood bearer may consume one ordinary dragon-blood material from each of the four thrones and overcome the erosion and fusion trial to become a first-generation bearer of his blood. Bloodline provenance points to the Black Emperor; actual parents and House remain unchanged."

 trait_mm_dragon_branch_black_biological_desc:0 "$trait_mm_dragon_branch_black_desc$\n\nThis branch is recorded in biological sources or established dragon creation provenance. Only legitimate biological sources are inherited."

 trait_mm_dragon_branch_black_acquired_desc:0 "$trait_mm_dragon_branch_black_desc$\n\nThis is acquired blood, not biological ancestry. It is not automatically inherited by ordinary human descendants."

