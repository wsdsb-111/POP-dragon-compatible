l_english:
 mm_dragon_blood_generic_desc:0 "Direct royal-human offspring remain first generation; other direct dragon-human offspring remain S. Mixed-human offspring fall one tier; two mixed parents use one tier below the stronger parent, with C falling to ordinary human. Two black-blood parents always produce black blood. With one black-blood parent, use one tier below the other parent, or C if the other parent is ordinary human. Single-black and other mixed pairings have a 10% black mutation chance, increased to 20% by a Covenant parent. Covenant parents retain the separate 25% non-black upgrade above the stronger parent, capped at S; the black-parent upgrade remains capped at S. Covenant dragon-blood with an ordinary human gives lifelong diluted blood. Black blood does not imply Black Emperor ancestry."
 mm_dragon_request_half_dragon_interaction:0 "Discuss Dragon-Blood Kinship"
 mm_dragon_request_half_dragon_interaction_desc:0 "Seek this dragon's consent to breed a child of real parentage. Either adult human sex may participate without bathing in blood, with an opposite-sex adult dragon, a personal bond and no close kinship. The dragon parent has a five-year cooldown. Either the human or the true dragon may propose. The proposer keeps the egg; real parents determine its genealogy and culture. An autonomous successor who truly holds a dragon throne may also bond through a spouse, lover or soulmate. Other dragons still require their original tamed bond."
 mm_dragon_select_stable_mother_interaction:0 "Select Breeding Mother"
 mm_dragon_select_stable_mother_interaction_desc:0 "Select this adult female. Then use Force Breeding on an adult male in the same stable."
 mm_dragon_force_stable_breeding_interaction:0 "Force Breeding"
 mm_dragon_force_stable_breeding_interaction_desc:0 "Breed this male with the selected mother [Actor.MakeScope.Var('mm_dragon_selected_mother').Char.GetName] and immediately receive one egg. The mother has a one-year cooldown. A legendary parent gives each egg a 50% chance of legendary blood."
 mm_dragon_half_egg_name:0 "Half-Dragon Egg"
 mm_dragon_half_egg_desc:0 "Human and draconic blood mingle within this egg. A long-lived child in human form will emerge when it hatches."
 mm_dragon_birth.0001.t:0 "A Child of Dragon Blood"
 mm_dragon_birth.0001.desc:0 "The egg opens: [mm_dragon_new_child.GetName] is born to mother [mm_dragon_half_mother.GetName] and biological father [mm_dragon_half_father.GetName]. Their dragon marks come from [mm_dragon_half_dragon_parent.GetName]."
 mm_dragon_birth.0001.a:0 "Welcome to the world."
 trait_mm_dragon_half:0 "Mixed Blood: Progenitor"
 trait_mm_dragon_lineage_1:0 "Mixed Blood: Grade S"
 trait_mm_dragon_lineage_2:0 "Mixed Blood: Grade A"
 trait_mm_dragon_lineage_3:0 "Mixed Blood: Grade B"
 trait_mm_dragon_lineage_4:0 "Mixed Blood: Grade C"
