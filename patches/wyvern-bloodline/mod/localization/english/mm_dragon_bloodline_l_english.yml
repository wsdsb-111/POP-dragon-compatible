 mm_dragon_blood_hunt_interaction:0 "Hunt a Higher Bloodline"

 mm_dragon_blood_hunt_interaction_desc:0 "Fight a higher-grade adult mixed-blood in native lethal single combat. Only a real kill grants absorption; defeat can kill you. C to B costs 12, B to A 30, and A to S 60 points. Each kill grants at most one grade; first generation cannot be earned this way."

