 trait_mm_dragon_branch_fire:0 "Bronze and Fire Branch"

 trait_mm_dragon_branch_fire_desc:0 "The distinct power of Bronze and Fire. Biological ancestry and acquired blood are recorded separately and survive culture or house changes."

 trait_mm_dragon_branch_fire_biological_desc:0 "$trait_mm_dragon_branch_fire_desc$\n\nThis branch is recorded in biological sources or established dragon creation provenance. Only legitimate biological sources are inherited."

 trait_mm_dragon_branch_fire_acquired_desc:0 "$trait_mm_dragon_branch_fire_desc$\n\nThis is acquired blood, not biological ancestry. It is not automatically inherited by ordinary human descendants."

