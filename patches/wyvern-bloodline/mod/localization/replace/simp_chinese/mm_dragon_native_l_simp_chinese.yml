l_simp_chinese:
 trait_myv_wyvern:0 "龙族"
 trait_myv_wyvern_desc:0 "拥有双翼、利爪与长尾的龙族。\n\n无法自然生育，但仍可在满足条件时通过协商繁育或兽栏产蛋延续后裔。"
 trait_myv_wyvern_tamed:0 "已驯服的龙族"
 trait_myv_wyvern_tamed_desc:0 "已与人建立羁绊的龙族。\n\n无法自然生育，但仍可在满足条件时通过协商繁育或兽栏产蛋延续后裔。"
 trait_myv_wyvern_legendary:0 "龙王"
 trait_myv_wyvern_legendary_desc:0 "拥有传奇躯体的龙族。具名龙王与黑白皇的王权由各自王权特质决定；传奇血统的后代不会自动获得具名王位。\n\n无法自然生育，但仍可在满足条件时通过协商繁育或兽栏产蛋延续后裔。"
 myv_wyvern_sex_male_tt:0 "雄性龙族"
 myv_wyvern_sex_female_tt:0 "雌性龙族"
