 trait_mm_dragon_branch_fire:0 "青铜与火血脉分支"

 trait_mm_dragon_branch_fire_desc:0 "对应青铜与火的独立权能。生物血脉与后天吸收分别记录，不因改文化或家族而覆盖。"

 trait_mm_dragon_branch_fire_biological_desc:0 "$trait_mm_dragon_branch_fire_desc$\n\n生物祖源／既有创造归属中包含本分支；后代只依合法生物来源继承。"

 trait_mm_dragon_branch_fire_acquired_desc:0 "$trait_mm_dragon_branch_fire_desc$\n\n此分支来自后天获得的龙血，不是生物祖先，也不会自动遗传给普通人类后代。"

