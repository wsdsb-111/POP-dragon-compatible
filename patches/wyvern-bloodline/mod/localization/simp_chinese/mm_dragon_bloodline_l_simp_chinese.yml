l_simp_chinese:
 mm_dragon_blood_generic_desc:0 "龙王与人类直系后代固定为初代种，普通真龙与人类直系后代固定为S级。混血与普通人的后代降一级；双混血按较强亲本降一级，C级降为普通人。双黑血亲本的子女必为黑血；仅一方黑血时，基础等级按另一方降一级，另一方为普通人则为C级。单黑血与其他混血配对均有10%黑血突变率；始祖派亲本使其升至20%。始祖派亲本的非黑血后代另有25%几率比更强亲本高一级，最高S级；黑血亲本的该项加成仍以S级为上限。始祖派龙血者与无龙血者的子代终身血脉稀薄。黑血不代表黑皇祖源。"
 mm_dragon_request_half_dragon_interaction:0 "协商龙血繁育"
 mm_dragon_request_half_dragon_interaction_desc:0 "向这位龙族化身征求同意，与其孕育真实亲缘的龙血后裔。任意成年异性人类均可参与，无需沐血；双方须有羁绊且非近亲。雌龙与男性、雄龙与女性均按真实母父记录，龙亲本五年冷却。 人类或真正龙族均可主动提出；蛋由提出者保管，亲缘与文化仍按真实亲本。 自主接位的真正龙王还可凭配偶、情人或灵魂伴侣关系建立羁绊；其他龙族仍须原有驯养羁绊。"
 mm_dragon_select_stable_mother_interaction:0 "指定繁育母龙"
 mm_dragon_select_stable_mother_interaction_desc:0 "将这条成年母龙选为繁育对象。随后对同一兽栏中的成年雄龙选择“强制繁殖”。"
 mm_dragon_force_stable_breeding_interaction:0 "强制繁殖"
 mm_dragon_force_stable_breeding_interaction_desc:0 "让这条雄龙与已指定的母龙[Actor.MakeScope.Var('mm_dragon_selected_mother').Char.GetName]立即繁育一颗龙蛋。母龙一年冷却；传说亲本的蛋有50%概率继承传说血脉。"
 mm_dragon_half_egg_name:0 "半龙之蛋"
 mm_dragon_half_egg_desc:0 "人类与龙族的血脉在蛋中交融。孵化后将诞生长寿的人形龙血后裔。"
 mm_dragon_birth.0001.t:0 "破壳而生的龙血后裔"
 mm_dragon_birth.0001.desc:0 "龙蛋裂开，诞生了[mm_dragon_new_child.GetName]。其母亲是[mm_dragon_half_mother.GetName]，生物父亲是[mm_dragon_half_father.GetName]；龙族印记来自[mm_dragon_half_dragon_parent.GetName]。"
 mm_dragon_birth.0001.a:0 "欢迎来到这个世界。"
 trait_mm_dragon_half:0 "混血种·初代种"
