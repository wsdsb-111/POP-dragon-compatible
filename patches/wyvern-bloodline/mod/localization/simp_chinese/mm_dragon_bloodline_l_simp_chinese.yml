 trait_mm_dragon_branch_white:0 "白皇血脉分支"

 trait_mm_dragon_branch_white_desc:0 "白皇血脉源自人类对白皇圣骸之血的研究：研究者以圣血制造怪物，再使人类怀上怪物的孩子，由此形成可延续的混血谱系。这些家系并非白皇与人类直接生育的自然后裔。血源始祖记录指向白皇，表示力量源头，不代表白皇是其亲生母亲。"

 trait_mm_dragon_branch_white_biological_desc:0 "$trait_mm_dragon_branch_white_desc$\n\n圣骸实验形成的血脉可由其人类后裔传承；记录不改写真实父母与家族。"

 trait_mm_dragon_branch_white_acquired_desc:0 "$trait_mm_dragon_branch_white_desc$\n\n此分支来自后天获得的龙血，不是生物祖先，也不会自动遗传给普通人类后代。"

 trait_mm_dragon_branch_black:0 "黑皇血脉分支"

 trait_mm_dragon_branch_black_desc:0 "黑皇没有默认生成的自然混血家系。黑血者集齐火、地、海、风四系普通龙血，并通过侵蚀与融合考验，方可晋升黑皇血脉，成为初代种；血脉始祖改指黑皇，真实父母与家族不变。"

 trait_mm_dragon_branch_black_biological_desc:0 "$trait_mm_dragon_branch_black_desc$\n\n生物祖源／既有创造归属中包含本分支；后代只依合法生物来源继承。"

