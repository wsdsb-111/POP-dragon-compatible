 trait_mm_pod_mokole_gifts:0 "龙血·灵界天赋（已整合）"
 trait_mm_pod_mokole_gifts_desc:0 "与莫科莱固有天赋合计：灵界资质取至少50%，感知取至少5%；更强的莫科莱成长保留。再生、治疗与先祖灵能力沿用种族本身，不重复列出。"
