l_simp_chinese:
 mm_relic_subjugate_interaction:0 "龙之臣服"
 mm_relic_subjugate_interaction_desc:0 "佩戴或陈列暴君始祖黑鳞冠，以黑皇血脉强制普通龙族臣服。无需驯服进度；会解除该龙原有的骑乘和羁绊。不能用于龙王，圣物冷却4年。"
 mm_relic_destroy_interaction:0 "始祖毁灭"
 mm_relic_destroy_interaction_desc:0 "以黑皇血脉发动权柄，直接处死龙王级以下的普通龙族或混血种，不经过伤势、决斗或临死救援判定。真龙结算龙头与五类材料；混血不产生龙尸材料。圣物冷却5年。"
 mm_relic_oracle_interaction:0 "意识操作"
 mm_relic_oracle_interaction_desc:0 "使用白色神谕之书，无需同意或成功率判定，将目标设为原生世俗或神职傀儡，并把其领地与非免疫封臣强制改为神谕派。黑白皇及黑白皇血脉免疫；其余龙王与混血可被控制。需要 By God Alone 傀儡机制，圣物冷却5年。"
 mm_relic_fire_forging_decision:0 "火之熔铸"
 mm_relic_fire_forging_decision_desc:0 "三年内忽略当前启用模组宝物模板中的装备与完整收益脚本门槛。所有权、槽位和DLC机制继续由游戏判定；不会获得未持有的物品。圣物冷却5年。"
 mm_relic_earth_creation_decision:0 "地之造物"
 mm_relic_earth_creation_decision_desc:0 "两年内，直属领地建筑工期减少30%，建筑金币花费减少80%。不作用于封臣领地或住所建造。圣物冷却5年。"
 mm_relic_sea_trade_decision:0 "海之贸易"
 mm_relic_sea_trade_decision_desc:0 "三年内，直属沿海县税收增加50%，住所收入增加30%；本机丝路正向税收修正额外放大20%。不放大全部税基，不作用于封臣领地。圣物冷却5年。"
 mm_relic_sky_execution_decision:0 "风暴索命"
 mm_relic_sky_execution_decision_desc:0 "三年内勇武+20、军事+10，并立即随机获得三个尚未拥有且不冲突的原版将领特质；获得的特质永久保留。持续期间可向相邻领国发动无虔诚或威望费用的王国级征服战争，沿用原生战争结算。至少需要三个可用的未获特质。圣物冷却5年。"
