 mm_relic_storm_kingdom_cb:0 "风暴王国征服"
 mm_relic_fire_forging_decision_tooltip:0 "三年内忽略当前启用模组宝物模板中的装备与完整收益脚本门槛。所有权、槽位和DLC机制继续由游戏判定；不会获得未持有的物品。圣物冷却5年。"
