 mm_relic_sea_trade_decision_confirm:0 "释放圣物力量"
 mm_relic_sky_execution_decision_confirm:0 "释放圣物力量"
 mm_relic_fire_forging_desc:0 "在此修正有效期间，忽略宝物模板中的装备条件与完整收益条件。所有权、槽位及DLC限制仍适用；不会解除其他圣物主动能力的血脉、礼仪与冷却要求。"
 mm_relic_earth_creation_desc:0 "地脉之力加速直属领地的建筑营建，并降低建筑金币花费。不作用于封臣领地或住所建造。"
 mm_relic_sea_trade_desc:0 "除下列住所收入加成外，直属沿海县获得额外50%税收，本机丝路正向税收修正额外放大20%。不作用于封臣领地。"
 mm_relic_sea_coastal_trade_desc:0 "海妖圣甲的海之贸易正在提高本县税收；力量到期或失去直属沿海县资格后停止刷新。"
 mm_relic_sky_execution_desc:0 "除下列属性加成外，发动时立即获得三个未有且不冲突的将领特质。修正持续期间解锁对相邻领国的王国级征服宣战。"
