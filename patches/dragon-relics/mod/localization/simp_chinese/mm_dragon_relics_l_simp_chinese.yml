 mm_relic_sky_spear_name:0 "永恒之矛昆古尼尔"
 mm_relic_sky_spear_desc:0 "天空与风之王的宿命神枪，以风暴龙骨锻造而成，便是神话之中那柄投出之后必定命中目标的昆古尼尔。枪身缠绕不息的狂风与因果纹路，呼啸的风暴会加持麾下战士，令军队疾驰如风。当持有者身负天空与风之王血脉，便可解放神枪全部力量，发动「风暴索命」，借苍穹狂风赐予自身超凡战力，更可向周遭列国宣告战争，贯彻逆命征伐的意志。枪中寄宿的因果宿命，持有者永远逃不开命运的博弈。"
