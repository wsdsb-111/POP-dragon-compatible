 mm_relic_fire_ring_ability_name:0 "火之熔铸"
 mm_relic_earth_sarcophagus_name:0 "常暗地脉石棺"
 mm_relic_earth_sarcophagus_desc:0 "从帝王谷地宫的地脉核心开凿而出的巨型石棺，大地与山之王沉睡之时便曾栖身于此。岩石内部流淌着地脉的力量，象征蛰伏、重生与冥界轮回，是冥府守陵祭司的至高圣物。地脉之力滋养领地民生，稳固婚姻血脉。若持有者拥有大地与山之王血脉，便可引动地脉洪流施展「地之造物」，以大地之力大幅缩减营建的消耗与工期。石棺沉静幽暗，会消磨统治者的统治威望，不利于短暂的强权统治。"
 modifier_mm_relic_earth_sarcophagus_stats:0 "常暗地脉石棺"
 mm_relic_earth_sarcophagus_stats:0 "常暗地脉石棺"
