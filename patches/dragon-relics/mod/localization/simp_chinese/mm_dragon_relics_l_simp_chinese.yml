l_simp_chinese:
 mm_relic_black_crown_name:0 "暴君始祖黑鳞冠"
 mm_relic_black_crown_desc:0 "由黑皇尼德霍格王座上脱落的原生黑曜石龙鳞，混合暗金熔铸而成的至高冠冕。它承载万龙之祖的威压与统治权柄，是始祖正统派的至高圣物。唯有恪守始祖圣约的信徒方能引动它的力量，若持有者流淌黑皇之血，便可发动古老的「龙之臣服」，迫使龙族血脉向始祖意志俯首。但冠冕之中回荡着黑皇末日的咆哮，会不断加重持有者的精神压力，长久佩戴会被毁灭的低语侵蚀心智。"
 modifier_mm_relic_black_crown_stats:0 "暴君始祖黑鳞冠"
 mm_relic_black_crown_stats:0 "暴君始祖黑鳞冠"
