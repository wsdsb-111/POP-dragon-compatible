 artifact_mm_relic_white_book_court:0 "白色神谕之书·宫廷圣器"
 mm_relic_white_book_ability_name:0 "意识操作"
 mm_relic_fire_ring_name:0 "烛龙青铜玄戒"
 mm_relic_fire_ring_desc:0 "青铜与火之王诺顿亲手铸造的权戒，以龙炉之中熔炼的上古青铜锻打成型，戒身布满流转的熔岩龙纹，是铸火宗世代守护的圣物。它承载炼金术与熔炉的力量，护佑领地营建、器物锻造。当佩戴者流淌青铜与火之王的血脉，便可启动「火之熔铸」，借龙王之火打破一切宝物的枷锁限制。但龙火力量灼烧血肉，会折损持有者的寿命。"
 modifier_mm_relic_fire_ring_stats:0 "烛龙青铜玄戒"
