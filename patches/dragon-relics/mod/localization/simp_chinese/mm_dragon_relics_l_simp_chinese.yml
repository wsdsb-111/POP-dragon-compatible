 artifact_mm_relic_black_crown_court:0 "暴君始祖黑鳞冠·宫廷圣器"
 mm_relic_black_crown_ability_name:0 "龙之臣服"
 mm_relic_black_regalia_name:0 "黑色皇帝之权柄"
 mm_relic_black_regalia_desc:0 "取自黑皇王座旁的祭祀礼器，上面镌刻着记述龙族创世与末日的古老龙文。权柄向外散发出令人骨髓战栗的始祖威压，凡人望见便心生恐惧。它掌握着审判低阶龙族与生灵的权能，凡俗混血与普通龙族在它的力量面前无处可逃。唯有继承黑皇血脉之人，方能启动「始祖毁灭」的终极审判，将目标彻底归于虚无。执掌此物，黑皇的暴戾意志会持续压迫持有者的精神。"
 modifier_mm_relic_black_regalia_stats:0 "黑色皇帝之权柄"
 mm_relic_black_regalia_stats:0 "黑色皇帝之权柄"
 artifact_mm_relic_black_regalia_inventory:0 "黑色皇帝之权柄"
 artifact_mm_relic_black_regalia_court:0 "黑色皇帝之权柄·宫廷圣器"
 mm_relic_black_regalia_ability_name:0 "始祖毁灭"
 mm_relic_white_book_name:0 "白色神谕之书"
 mm_relic_white_book_desc:0 "并非凡俗的书卷，是白皇伊邪那美以自身精神力凝结而成的神谕典籍。书页之上没有笔墨文字，只有流转变幻的意识幻象，记载着白皇对于宿命、精神与反叛的全部智慧。它可以安抚躁动的心神，窥探世间阴谋诡计，看穿人心的伪装。流淌白皇血脉的持有者，能够翻开禁页，施展「意识操作」，篡改生灵的意志，将其化为听命于教派的傀儡。但长久沉浸神谕，精神会不断被消耗，损伤躯体健康。"
 modifier_mm_relic_white_book_stats:0 "白色神谕之书"
 mm_relic_white_book_stats:0 "白色神谕之书"
