 mm_relic_earth_sarcophagus_ability_name:0 "地之造物"
 mm_relic_sea_armor_name:0 "怒潮海妖之甲"
 mm_relic_sea_armor_desc:0 "海洋与水之王的御用鳞甲，以深海巨兽的棱鳞锻合打造，甲面如水波流动，裹挟无尽深海的力量，怒潮宗的贵族战士梦寐以求的圣物。铠甲护佑战士抵御伤害，提升魅力，笼络封臣与海洋部族。流淌海洋龙王血脉的持有者，可以引动四海潮汐施展「海之贸易」，借汪洋之力暴涨沿海领地的财富与商路收益。"
 modifier_mm_relic_sea_armor_stats:0 "怒潮海妖之甲"
