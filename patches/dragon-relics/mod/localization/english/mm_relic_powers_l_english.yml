l_english:
 mm_relic_subjugate_interaction:0 "Draconic Submission"
 mm_relic_subjugate_interaction_desc:0 "Use the crown and Black Emperor blood to force an ordinary dragon to submit, clearing its former riding and keeper bond. No taming progress is required. Dragon Kings are excluded. Artifact cooldown: 4 years."
 mm_relic_destroy_interaction:0 "Progenitor Destruction"
 mm_relic_destroy_interaction_desc:0 "Use the regalia and Black Emperor blood to kill a nonroyal ordinary dragon or mixed-blood directly, without an injury, duel or rescue roll. A true dragon grants a head and all five materials. Mixed-blood victims do not grant dragon remains. Artifact cooldown: 5 years."
 mm_relic_oracle_interaction:0 "Consciousness Manipulation"
 mm_relic_oracle_interaction_desc:0 "Use the book to create a native secular or clerical puppet without consent or a success roll, and force its counties and nonimmune vassals to the White rite. The Black Emperor, White Empress and their bloodlines are immune; other Dragon Kings and mixed-bloods can be controlled. Requires By God Alone. Artifact cooldown: 5 years."
 mm_relic_fire_forging_decision:0 "Fire Forging"
 mm_relic_fire_forging_decision_desc:0 "For 3 years, bypass active-playset artifact template equip and full-benefit script requirements. Engine ownership, slots and DLC rules remain in force. Artifact cooldown: 5 years."
 mm_relic_earth_creation_decision:0 "Earth Creation"
 mm_relic_earth_creation_decision_desc:0 "For 2 years, reduce ordinary building time by 30% and gold cost by 80% in your direct domain. Vassal domains and domicile construction are excluded. Artifact cooldown: 5 years."
 mm_relic_sea_trade_decision:0 "Sea Trade"
 mm_relic_sea_trade_decision_desc:0 "For 3 years, gain +50% county tax in directly held coastal counties, +30% domicile income, and an extra 20% of positive native Silk Road tax modifiers. Vassal counties are excluded. Artifact cooldown: 5 years."
 mm_relic_sky_execution_decision:0 "Storm Execution"
 mm_relic_sky_execution_decision_desc:0 "Gain +20 prowess and +10 martial for 3 years, and permanently gain three new, nonconflicting native commander traits. During the buff, unlock a neighboring-realm kingdom conquest with no prestige or piety cost and native war outcomes. Requires three available traits. Artifact cooldown: 5 years."
