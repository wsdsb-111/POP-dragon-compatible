 mm_relic_sky_execution_decision_confirm:0 "Invoke the sacred power"
 mm_relic_fire_forging_desc:0 "While active, bypass artifact template equip and full-benefit requirements. Ownership, slots and DLC rules still apply. Other sacred powers retain their bloodline, rite and cooldown requirements."
 mm_relic_earth_creation_desc:0 "Earth power reduces building time and gold costs in your direct domain. Vassal domains and domicile construction are excluded."
 mm_relic_sea_trade_desc:0 "In addition to the domicile income below, directly held coastal counties receive +50% tax and positive native Silk Road tax modifiers receive an extra 20%. Vassal counties are excluded."
 mm_relic_sea_coastal_trade_desc:0 "Sea Trade increases this county tax while the sacred power is active and the county remains directly held and coastal."
 mm_relic_sky_execution_desc:0 "On activation, gain three new nonconflicting commander traits. While this modifier lasts, unlock kingdom conquest against neighboring realms, in addition to the attributes below."
