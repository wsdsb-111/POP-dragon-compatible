 trait_mm_royal_fire_desc:0 "执掌火焰与炼金术的初代王座，诺顿与康斯坦丁兄弟共掌权与力。中原铸鼎氏族深入龙穴，弑杀了沉睡的火龙君王，以龙血铸就炎汉血脉。继承者可唤出焚世烛龙，却永困于兄弟相残的王座诅咒。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
 trait_mm_royal_earth_desc:0 "执掌地脉与冥界的初代王座，耶梦加得与芬里厄姐妹共生一体。上埃及守陵氏族世代守护地宫龙骸，终以僭越之举夺下冥府权能。继承者可撼动山岳、开启亡者尼伯龙根，亦将被深渊疯狂逐步侵蚀。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
 trait_mm_royal_sea_desc:0 "执掌潮汐与深渊的初代王座，利维坦与贝西摩斯姐弟同座。地中海执政官家族于深海遗迹寻获海龙残躯，以人躯强夺汪洋权柄。继承者可掀起灭世海啸，却终将被无尽深海的孤寂吞没。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
 trait_mm_royal_sky_desc:0 "执掌风暴与因果的初代王座，奥丁与瓦尔基里兄妹相峙。北境维京战团弑杀天穹风龙，以昆古尼尔残枪染血，铸就风暴王族。继承者可呼召狂风、改写命运轨迹，却永远逃不出逆命者的终局。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
