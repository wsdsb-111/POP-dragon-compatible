 mm_royal_wake_black_emperor_desc:0 "黑皇·尼德霍格仍然活着。仪式将唤醒原本的龙王，保留人物身份、关系与权能。\n\n白皇已苏醒，四座王权均已合一，并与至少一位合一君主建立羁绊；消耗10000金币、10000威望、5000虔诚。"
