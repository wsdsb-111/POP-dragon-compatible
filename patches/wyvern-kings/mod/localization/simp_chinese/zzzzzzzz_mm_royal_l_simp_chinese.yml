l_simp_chinese:
 trait_myv_wyvern_legendary:0 "龙王"
 trait_myv_wyvern_legendary_desc:0 "拥有古老王权的龙族。具名双生龙王及黑白皇的完整权能由各自王权特质保留，驯服不会剥夺其身份。"
 trait_mm_royal_dragon_king:0 "双生龙王"
 trait_mm_royal_dragon_king_desc:0 "同一王座的双生君主，各自持有一半权能。只有吞噬自己的双生子才能合一。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
 trait_mm_royal_complete:0 "合一君主"
 trait_mm_royal_complete_desc:0 "吞噬同座双生子后，古老王权归于一身。另一位已永久死亡，幸存者保留原本身份与创造谱系。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
 trait_mm_royal_black_emperor:0 "黑皇"
 trait_mm_royal_black_emperor_desc:0 "龙族至高始祖，以绝望与毁灭开创万龙纪元，亲手缔造白王与四大君主。传说祂被人类与叛王联手弑杀于王座之上，龙血浸染了初代弑王者的血脉。承载此血者将执掌万龙之上的权柄，亦将永世背负龙皇的末日低语。\n\n每次MYV部位伤害有70%概率完全免伤，失败则承受原伤势；不等同于免疫所有直接死亡脚本。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
 trait_mm_royal_white_empress:0 "白皇"
 trait_mm_royal_white_empress_desc:0 "黑王最初的造物，执掌精神与神谕的白色皇帝。祂掀起龙族史上最大的叛乱，战败后本体被彻底摧毁，仅余残血与圣骸流落人间。融合此血者可操控人心幻境，却终将被反叛者的宿命吞噬神智。\n\n每次MYV部位伤害有70%概率完全免伤，失败则承受原伤势；不等同于免疫所有直接死亡脚本。\n\n不因衰老自然死亡；不因衰老失能，外貌不再衰老。免疫疾病，身体提供瘟疫抗性+100，不重复叠加。每个受伤部位每日恢复1点。随骑手或作为独立骑士实际随军时，为军队指挥官提供王权支援；同军只取最高阶，离队后最多2天消退。饥饿、营养不良和部位伤势仍削弱实际战力。"
 trait_mm_royal_torpor:0 "远古蛰眠"
 mm_royal_torpor_desc:0 "此龙仍然存活，但意识沉入漫长蛰眠。不能参与猎杀、游荡、繁育、骑乘、人形切换或作为骑士出征，停止饥饿消耗；王权肉体仍每日恢复。只有对应唤醒决议能令其复苏，复苏保留同一人物。"
