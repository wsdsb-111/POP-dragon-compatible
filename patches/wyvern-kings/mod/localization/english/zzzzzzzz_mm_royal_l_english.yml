l_english:
 trait_myv_wyvern_legendary:0 "Dragon King"
 trait_myv_wyvern_legendary_desc:0 "A dragon of ancient royal power. Named sovereigns retain their own royal trait and identity after taming."
 trait_mm_royal_dragon_king:0 "Twin Dragon King"
 trait_mm_royal_dragon_king_desc:0 "One of the twin sovereigns sharing a throne. Only consuming the matching twin restores complete authority.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
 trait_mm_royal_complete:0 "United Sovereign"
 trait_mm_royal_complete_desc:0 "The matching twin has been permanently consumed. The survivor holds the complete throne while retaining identity and creation lineage.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
 trait_mm_royal_black_emperor:0 "Black Emperor"
 trait_mm_royal_black_emperor_desc:0 "The supreme progenitor opened the age of dragons through despair and destruction, creating the White Empress and the four sovereign thrones. Legends say humans and rebel kings slew him upon his throne, staining the first regicides with his blood. Its bearer commands all dragons, yet forever hears the emperor's apocalyptic whispers.\n\nEach MYV anatomical injury has a 70% chance to be fully negated; otherwise normal injury applies. This does not negate every direct scripted death.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
 trait_mm_royal_white_empress:0 "White Empress"
 trait_mm_royal_white_empress_desc:0 "The Black Emperor's first creation, the white sovereign of minds and prophecy, led the greatest rebellion in dragon history. Her defeated body was destroyed; only blood and sacred remains were scattered among mortals. Those who fuse with that blood may command minds and visions, but inherit the rebel's consuming fate.\n\nEach MYV anatomical injury has a 70% chance to be fully negated; otherwise normal injury applies. This does not negate every direct scripted death.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
 trait_mm_royal_torpor:0 "Ancient Torpor"
 mm_royal_torpor_desc:0 "Alive in a profound torpor. Excluded from hunts, roaming, breeding, riding, form changes and independent knight service; hunger consumption stops, but royal wounds still heal daily. The matching awakening decision wakes this same character."
 trait_mm_royal_torpor_desc:0 "$mm_royal_torpor_desc$"
