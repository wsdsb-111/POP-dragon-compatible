 mm_royal_devour_desc:0 "Order [recipient.GetName] to consume [recipient.MakeScope.Var('mm_royal_twin').Char.GetName] and unite their throne.\n\n#N The consumed twin dies permanently and cannot be awakened.#! The survivor retains identity, sex, family and creation relations, and receives the united name. Both twins must be awake and bonded to you."
