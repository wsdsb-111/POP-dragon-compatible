 trait_mm_royal_fire_desc:0 "Norton and Constantine share the primordial throne of flame and alchemy. A cauldron-forging clan entered their lair and slew a sleeping fire sovereign, founding the Yanhan bloodline. Its heirs may summon world-burning flame, yet remain bound to the curse of fratricide.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
 trait_mm_royal_earth_desc:0 "Jormungandr and Fenrir share the primordial throne of earth and the underworld. Upper Egyptian tomb-keepers guarded the buried dragon remains before usurping their power. Their heirs may shake mountains and open the Nibelungen of the dead, while abyssal madness slowly consumes them.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
 trait_mm_royal_sea_desc:0 "Leviathan and Behemoth share the primordial throne of tides and the abyss. A Mediterranean ruling family found a sea dragon's remains in submerged ruins and seized oceanic power with mortal flesh. Their heirs may unleash world-ending waves, yet drown in the solitude of the endless deep.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
 trait_mm_royal_sky_desc:0 "Odin and Valkyrie face one another upon the primordial throne of storms and causality. Northern warriors slew a sky dragon and bloodied the broken spear Gungnir, founding a storm dynasty. Its heirs may summon raging winds and rewrite destiny, yet never escape the fate of those who defy it.\n\nAgeless, with no age-related incapacity or visual aging. Disease immunity; the dragon body supplies +100 epidemic resistance without double stacking. Each injured body part recovers 1 point daily. When actually deployed through a rider or as an independent knight, grants royal support to the army commander; only the highest rank applies and expires within 2 days after departure. Hunger, malnutrition and anatomical wounds still reduce actual power."
