name: Standalone compatibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=384
